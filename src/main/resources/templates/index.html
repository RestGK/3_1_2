<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-text text-white">
        <strong th:text="${currentUser.email}">admin@mail.ru</strong> with roles:
        <span th:text="${currentUser.roles.?[name == 'ROLE_ADMIN'].size() > 0 ? 'Admin' : 'User'}"></span>
    </span>
    <form th:action="@{/logout}" method="post" class="mb-0">
        <button type="submit" class="btn btn-link text-secondary text-decoration-none">Logout</button>
    </form>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- Боковая панель -->
        <div class="col-2 bg-white min-vh-100 border-end px-0">
            <div class="nav flex-column nav-pills pt-3">
                <a class="nav-link active rounded-0" th:href="@{/admin}">Admin</a>
                <a class="nav-link rounded-0" th:href="@{/user}">User</a>
            </div>
        </div>

        <!-- Основной контент -->
        <div class="col-10 p-4">
            <h1 class="mb-4">Admin panel</h1>

            <ul class="nav nav-tabs" id="adminTabs" role="tablist">
                <li class="nav-item">
                    <button class="nav-link active" id="users-tab" data-bs-toggle="tab" data-bs-target="#users-table-pane" type="button" role="tab" aria-controls="users-table-pane" aria-selected="true">
                        Users table
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" id="new-user-tab" data-bs-toggle="tab" data-bs-target="#new-user-pane" type="button" role="tab" aria-controls="new-user-pane" aria-selected="false">
                        New User
                    </button>
                </li>
            </ul>

            <div class="tab-content">
                <!-- Вкладка Users table -->
                <div class="tab-pane fade show active" id="users-table-pane" role="tabpanel" aria-labelledby="users-tab">
                    <div class="card rounded-0 border-top-0">
                        <div class="card-header bg-white">
                            <h5 class="mb-0">All users</h5>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-striped align-middle mb-0">
                                    <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>First Name</th>
                                        <th>Last Name</th>
                                        <th>Age</th>
                                        <th>Email</th>
                                        <th>Role</th>
                                        <th>Edit</th>
                                        <th>Delete</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="user, iterStat : ${users}">
                                        <td th:text="${iterStat.count}">1</td>
                                        <td th:text="${user.firstName}"></td>
                                        <td th:text="${user.lastName}"></td>
                                        <td th:text="${user.age}"></td>
                                        <td th:text="${user.email}"></td>
                                        <td th:text="${user.roles.?[name == 'ROLE_ADMIN'].size() > 0 ? 'Admin' : 'User'}"></td>
                                        <td>
                                            <button type="button" class="btn btn-info btn-sm text-white" data-bs-toggle="modal" th:data-bs-target="'#editModal' + ${user.id}">
                                                Edit
                                            </button>

                                            <!-- Модальное окно редактирования -->
                                            <div class="modal fade" th:id="'editModal' + ${user.id}" tabindex="-1" aria-hidden="true">
                                                <div class="modal-dialog modal-dialog-centered">
                                                    <div class="modal-content">
                                                        <form th:action="@{/admin/updateuser}" method="post">
                                                            <div class="modal-header">
                                                                <h5 class="modal-title">Edit user</h5>
                                                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                                            </div>
                                                            <div class="modal-body">
                                                                <input type="hidden" name="id" th:value="${user.id}">

                                                                <div class="mb-3">
                                                                    <label class="form-label fw-bold">ID</label>
                                                                    <input type="text" class="form-control" th:value="${user.id}" disabled>
                                                                </div>
                                                                <div class="mb-3">
                                                                    <label class="form-label fw-bold">First name</label>
                                                                    <input type="text" name="firstName" class="form-control" th:value="${user.firstName}">
                                                                </div>
                                                                <div class="mb-3">
                                                                    <label class="form-label fw-bold">Last name</label>
                                                                    <input type="text" name="lastName" class="form-control" th:value="${user.lastName}">
                                                                </div>
                                                                <div class="mb-3">
                                                                    <label class="form-label fw-bold">Age</label>
                                                                    <input type="number" name="age" class="form-control" th:value="${user.age}">
                                                                </div>
                                                                <div class="mb-3">
                                                                    <label class="form-label fw-bold">Email</label>
                                                                    <input type="text" name="email" class="form-control" th:value="${user.email}">
                                                                </div>
                                                                <div class="mb-3">
                                                                    <label class="form-label fw-bold">Password</label>
                                                                    <input type="password" name="password" class="form-control" placeholder="Leave blank to keep current">
                                                                </div>
                                                                <div class="mb-3">
                                                                    <label class="form-label fw-bold">Role</label>
                                                                    <select name="roles" class="form-select" multiple size="2">
                                                                        <option th:each="role : ${allRoles}"
                                                                                th:value="${role.id}"
                                                                                th:text="${role.displayName}"
                                                                                th:selected="${user.roles.contains(role)}"></option>
                                                                    </select>
                                                                </div>
                                                            </div>
                                                            <div class="modal-footer">
                                                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                                                <button type="submit" class="btn btn-primary">Edit</button>
                                                            </div>
                                                        </form>
                                                    </div>
                                                </div>
                                            </div>
                                        </td>
                                        <td>
                                            <button type="button" class="btn btn-danger btn-sm" data-bs-toggle="modal" th:data-bs-target="'#deleteModal' + ${user.id}">
                                                Delete
                                            </button>

                                            <!-- Модальное окно удаления – полная информация -->
                                            <div class="modal fade" th:id="'deleteModal' + ${user.id}" tabindex="-1" aria-hidden="true">
                                                <div class="modal-dialog modal-dialog-centered">
                                                    <div class="modal-content">
                                                        <form th:action="@{/admin/delete}" method="post">
                                                            <div class="modal-header">
                                                                <h5 class="modal-title">Delete user</h5>
                                                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                                            </div>
                                                            <div class="modal-body text-center">
                                                                <input type="hidden" name="id" th:value="${user.id}">

                                                                <div class="mb-3">
                                                                    <label class="form-label fw-bold">ID</label>
                                                                    <input type="text" class="form-control" th:value="${user.id}" disabled>
                                                                </div>
                                                                <div class="mb-3">
                                                                    <label class="form-label fw-bold">First name</label>
                                                                    <input type="text" class="form-control" th:value="${user.firstName}" disabled>
                                                                </div>
                                                                <div class="mb-3">
                                                                    <label class="form-label fw-bold">Last name</label>
                                                                    <input type="text" class="form-control" th:value="${user.lastName}" disabled>
                                                                </div>
                                                                <div class="mb-3">
                                                                    <label class="form-label fw-bold">Age</label>
                                                                    <input type="text" class="form-control" th:value="${user.age}" disabled>
                                                                </div>
                                                                <div class="mb-3">
                                                                    <label class="form-label fw-bold">Email</label>
                                                                    <input type="text" class="form-control" th:value="${user.email}" disabled>
                                                                </div>
                                                                <div class="mb-3">
                                                                    <label class="form-label fw-bold">Role</label>
                                                                    <select class="form-select" multiple size="2" disabled>
                                                                        <option th:each="role : ${allRoles}"
                                                                                th:value="${role.id}"
                                                                                th:text="${role.displayName}"
                                                                                th:selected="${user.roles.contains(role)}"></option>
                                                                    </select>
                                                                </div>
                                                                <p class="text-danger mt-2">Вы уверены, что хотите удалить этого пользователя?</p>
                                                            </div>
                                                            <div class="modal-footer">
                                                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                                                <button type="submit" class="btn btn-danger">Delete</button>
                                                            </div>
                                                        </form>
                                                    </div>
                                                </div>
                                            </div>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Вкладка New User-->
                <div class="tab-pane fade" id="new-user-pane" role="tabpanel" aria-labelledby="new-user-tab">
                    <div class="card rounded-0 border-top-0">
                        <div class="card-header bg-white">
                            <h5 class="mb-0">Add new user</h5>
                        </div>
                        <div class="card-body">
                            <div class="row justify-content-center">
                                <div class="col-12 col-md-7 col-lg-4">
                                    <form id="addUserForm" th:action="@{/admin/adduser}" method="post" class="text-center">
                                        <div class="mb-3">
                                            <label for="firstName" class="form-label fw-bold mb-1">First name</label>
                                            <input id="firstName" type="text" name="firstName" class="form-control" required>
                                            <div class="invalid-feedback" id="firstNameError" style="display: none;">Недопустимый символ</div>
                                        </div>
                                        <div class="mb-3">
                                            <label for="lastName" class="form-label fw-bold mb-1">Last name</label>
                                            <input id="lastName" type="text" name="lastName" class="form-control" required>
                                            <div class="invalid-feedback" id="lastNameError" style="display: none;">Недопустимый символ</div>
                                        </div>
                                        <div class="mb-3">
                                            <label for="age" class="form-label fw-bold mb-1">Age</label>
                                            <input id="age" type="number" name="age" class="form-control">
                                        </div>
                                        <div class="mb-3">
                                            <label for="email" class="form-label fw-bold mb-1">Email</label>
                                            <input id="email" type="email" name="email" class="form-control" required>
                                        </div>
                                        <div class="mb-3">
                                            <label for="password" class="form-label fw-bold mb-1">Password</label>
                                            <input id="password" type="password" name="password" class="form-control" required>
                                            <div class="invalid-feedback" id="passwordError" style="display: none;">Недопустимый символ</div>
                                        </div>
                                        <div class="mb-3">
                                            <label for="roles" class="form-label fw-bold mb-1">Role</label>
                                            <select id="roles" name="roles" class="form-select" multiple size="2">
                                                <option th:each="role : ${allRoles}"
                                                        th:value="${role.id}"
                                                        th:text="${role.displayName}"></option>
                                            </select>
                                        </div>
                                        <button type="submit" id="addUserBtn" class="btn btn-success px-4 disabled" disabled>Add new user</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function() {
        const firstNameInput = document.getElementById('firstName');
        const lastNameInput = document.getElementById('lastName');
        const passwordInput = document.getElementById('password');
        const addBtn = document.getElementById('addUserBtn');
        const firstNameError = document.getElementById('firstNameError');
        const lastNameError = document.getElementById('lastNameError');
        const passwordError = document.getElementById('passwordError');

        // Только латиница и дефис для имени/фамилии
        const namePattern = /^[A-Za-z\-]+$/;
        // Только английские буквы для пароля
        const passwordPattern = /^[A-Za-z]+$/;

        function validateField(input, errorDiv, pattern) {
            const value = input.value.trim();
            if (value.length === 0) {
                errorDiv.style.display = 'none';
                input.classList.remove('is-invalid');
                return false;
            }
            if (!pattern.test(value)) {
                errorDiv.style.display = 'block';
                input.classList.add('is-invalid');
                return false;
            } else {
                errorDiv.style.display = 'none';
                input.classList.remove('is-invalid');
                return true;
            }
        }

        function updateButtonState() {
            const isFirstNameValid = validateField(firstNameInput, firstNameError, namePattern);
            const isLastNameValid = validateField(lastNameInput, lastNameError, namePattern);
            const isPasswordValid = validateField(passwordInput, passwordError, passwordPattern)
                && passwordInput.value.trim().length > 0;

            const isFormValid = isFirstNameValid && isLastNameValid && isPasswordValid
                && firstNameInput.value.trim().length > 0
                && lastNameInput.value.trim().length > 0;

            if (isFormValid) {
                addBtn.classList.remove('disabled', 'btn-secondary');
                addBtn.classList.add('btn-success');
                addBtn.disabled = false;
            } else {
                addBtn.classList.add('disabled', 'btn-secondary');
                addBtn.classList.remove('btn-success');
                addBtn.disabled = true;
            }
        }

        [firstNameInput, lastNameInput, passwordInput].forEach(function(input) {
            input.addEventListener('input', updateButtonState);
        });

        document.getElementById('addUserForm').addEventListener('submit', function(e) {
            updateButtonState();
            if (addBtn.disabled) {
                e.preventDefault();
                if (!namePattern.test(firstNameInput.value.trim())) {
                    firstNameError.style.display = 'block';
                    firstNameInput.classList.add('is-invalid');
                }
                if (!namePattern.test(lastNameInput.value.trim())) {
                    lastNameError.style.display = 'block';
                    lastNameInput.classList.add('is-invalid');
                }
                if (!passwordPattern.test(passwordInput.value.trim())) {
                    passwordError.style.display = 'block';
                    passwordInput.classList.add('is-invalid');
                }
            }
        });

        // Начальное состояние – кнопка неактивна
        updateButtonState();
    })();
</script>
</body>
</html>
