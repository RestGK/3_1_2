<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1>Admin panel</h1>

    <!-- Кнопка Logout ОБЯЗАТЕЛЬНО через POST-форму с CSRF -->
    <form th:action="@{/logout}" method="post" class="mb-3">
        <button type="submit" class="btn btn-danger">Logout</button>
    </form>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>Id</th>
            <th>Name</th>
            <th>LastName</th>
            <th>Email</th>
            <th>Roles</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}">ID</td>
            <td th:text="${user.firstName}">Name</td>
            <td th:text="${user.lastName}">LastName</td>
            <td th:text="${user.email}">Email</td>
            <td th:text="${user.roles.![name]}">Roles</td>
            <td>
                <a th:href="@{/admin/updateuser(id=${user.id})}" class="btn btn-sm btn-warning">Update</a>
                <a th:href="@{/admin/deleteUser(id=${user.id})}" class="btn btn-sm btn-danger">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
    <a href="/admin/adduser" class="btn btn-primary">Add new user</a>
</div>
</body>
</html>
