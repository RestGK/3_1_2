<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
</head>
<body>

<h2>Login page</h2>

<form th:action="@{/login}" method="post">
    <div>
        Username: <input type="text" name="username"/>
    </div>

    <div>
        Password: <input type="password" name="password"/>
    </div>

    <div>
        <button type="submit">Login</button>
    </div>
</form>

</body>
</html>
