<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-white">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-6 col-lg-4">
            <div class="pt-5 mt-4">
                <h1 class="text-center fw-bold mb-3">Please sign in</h1>

                <!-- Блок ошибки с Гэндальфом -->
                <div th:if="${param.error}" class="text-center mb-3">
                    <img th:src="@{/images/gandalf.jpg}" alt="You shall not pass!" class="img-fluid" style="max-width: 400px;">
                    <p class="text-danger mt-2">Invalid email or password. Try again.</p>
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-2">
                        <input type="text" name="username" class="form-control" placeholder="Email address" autofocus required>
                    </div>
                    <div class="mb-3">
                        <input type="password" name="password" class="form-control" placeholder="Password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Sign in</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
