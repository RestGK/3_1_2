<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1>User page</h1>

    <form th:action="@{/logout}" method="post" class="mb-3">
        <button type="submit" class="btn btn-danger">Logout</button>
    </form>

    <div class="card">
        <div class="card-body">
            <h5 class="card-title" th:text="${user.firstName} + ' ' + ${user.lastName}">Name</h5>
            <p class="card-text" th:text="${user.email}">Email</p>
            <p class="card-text"><strong>Roles:</strong> <span th:text="${user.roles.![name]}">Roles</span></p>
        </div>
    </div>
</div>
</body>
</html>
